name: Validate Plasmoid

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes qt6-declarative-dev-tools libxml2-utils unzip zip

      - name: Validate metadata, QML and package contents
        run: ./tools/validate.sh
